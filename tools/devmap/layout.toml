# The map's drawing: what the tracker cannot say. devmap.py takes colours from each
# ticket's state and solid arrows from GitHub's blocking links; this file fixes the groups,
# the node order, the short labels, the fog, out of scope and the arrows the tracker does not hold.
# A map ticket missing here still shows, in "New tickets": give it a place.
#
# Node kinds: tickets = [n, ...] (label without "#n" or icons; several tickets make one node),
# done = "text" (work done before the map), fog = "text" (not yet specified),
# out = "text" (ruled out of scope), or tickets + out = true (closed as out of scope).

destination = "🎯 Validated Eoff and fixed-loss model,<br/>10–100 kHz, new Zenodo version"
map_issue = 1
repo = "luizvilla/test_bench_code"
# project_owner = "luizvilla"   # no GitHub Project yet: set both to enable it
# project_number = 0
stale_days = 3

edges = [
    "D3 --> N2",
    "D2 --> N9",
    "D1 --> N11",
    "N11 -.-> FS",
    "N14 -.-> FG",
    "N14 -.-> FC",
    "N10 -.-> FU",
    "FG -.-> FZ",
    "FS -.-> FZ",
    "N14 --> FZ",
    "FZ -.-> DEST",
]

[[group]]
id = "Before"
title = "Done before the map"
nodes = [
    { id = "D1", done = "16 Sept session, 50/60/70 kHz<br/>loss-breakdown Excel" },
    { id = "D2", done = "OnlyScripts supervisor<br/>(Maxime)" },
    { id = "D3", done = "Period-synced start/stop<br/>DMA sequences (Core)" },
]

